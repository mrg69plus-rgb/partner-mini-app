<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>❤️ انتخاب‌ها</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      padding-bottom: 90px;
      font-family: system-ui, sans-serif;

      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }

    h1 {
      margin: 5px 0 6px;
      font-size: 23px;
    }

    .subtitle {
      opacity: 0.65;
      margin-bottom: 18px;
    }

    #search {
      width: 100%;
      padding: 13px;
      border-radius: 13px;

      border: 1px solid
        var(--tg-theme-hint-color, #cccccc);

      background:
        var(--tg-theme-secondary-bg-color, #f3f3f3);

      color:
        var(--tg-theme-text-color, #000000);

      font-size: 16px;
      outline: none;

      margin-bottom: 14px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .option {
      min-height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 10px;

      text-align: center;

      border-radius: 13px;

      border: 1px solid
        var(--tg-theme-hint-color, #cccccc);

      background:
        var(--tg-theme-secondary-bg-color, #f3f3f3);

      cursor: pointer;

      user-select: none;

      transition: transform 0.08s;
    }

    .option:active {
      transform: scale(0.97);
    }

    .option.selected {
      border-color:
        var(--tg-theme-button-color, #2481cc);

      background:
        var(--tg-theme-button-color, #2481cc);

      color:
        var(--tg-theme-button-text-color, #ffffff);
    }

    .counter {
      margin-top: 18px;

      text-align: center;

      font-weight: bold;

      opacity: 0.8;
    }

    .custom {
      margin-top: 25px;
    }

    .custom-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .custom-row {
      display: flex;
      gap: 8px;
    }

    .custom input {
      min-width: 0;
      flex: 1;

      padding: 12px;

      border-radius: 12px;

      border: 1px solid
        var(--tg-theme-hint-color, #cccccc);

      background:
        var(--tg-theme-secondary-bg-color, #f3f3f3);

      color:
        var(--tg-theme-text-color, #000000);

      font-size: 15px;
      outline: none;
    }

    .custom button {
      padding: 0 17px;

      border: 0;

      border-radius: 12px;

      background:
        var(--tg-theme-button-color, #2481cc);

      color:
        var(--tg-theme-button-text-color, #ffffff);

      font-size: 15px;

      cursor: pointer;
    }

    .submit {
      position: fixed;

      bottom: 12px;
      right: 16px;
      left: 16px;

      width: calc(100% - 32px);

      padding: 15px;

      border: 0;

      border-radius: 14px;

      background:
        var(--tg-theme-button-color, #2481cc);

      color:
        var(--tg-theme-button-text-color, #ffffff);

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;
    }

    .submit:disabled {
      opacity: 0.5;
    }

    #message {
      text-align: center;

      margin-top: 15px;

      font-size: 14px;

      opacity: 0.8;
    }
  </style>
</head>

<body>

  <h1>❤️ انتخاب‌ها</h1>

  <div class="subtitle">
    مواردی که دوست داری رو انتخاب کن
  </div>

  <input
    id="search"
    type="text"
    placeholder="🔎 جستجو..."
    oninput="renderOptions()"
  >

  <div id="options" class="options"></div>

  <div class="counter">
    <span id="count">0</span>
    مورد انتخاب شده
  </div>

  <div class="custom">

    <div class="custom-title">
      ➕ گزینه خودت رو اضافه کن
    </div>

    <div class="custom-row">

      <input
        id="customInput"
        type="text"
        placeholder="مثلاً یک مورد دیگر..."
        maxlength="100"
      >

      <button onclick="addCustomOption()">
        اضافه
      </button>

    </div>

  </div>

  <div id="message"></div>

  <button
    id="submitButton"
    class="submit"
    onclick="submitChoices()"
  >
    🟢 ثبت انتخاب‌ها
  </button>


  <script>

    // ==========================================
    // آدرس Worker
    // بعداً این قسمت را تغییر می‌دهیم
    // ==========================================

    const WORKER_URL = "https://partner-selector-worker.mrg69plus.workers.dev/";


    // ==========================================
    // لیست گزینه‌ها
    // این قسمت را خودت می‌توانی تغییر بدهی
    // ==========================================

const options = [
  "سکس عادی و نرمال",
  "کتک زدن و تنبیه طولانی(حداقل ۳۰ دقیقه)",
  "سیلی تو صورت(خشن و زیاد)",
  "شلاق زدن با کمربند",
  "گرفتن گلو(ارام و با احتیاط) موقع سکس",
  "گذاشتن پا روی صورت و تحقیر",
  "گاییدن دهان",
  "ریختن تف روی صورت و بدن",
  "ریختن آب تو دهان",
  "ریختن آب رو کمر و کون",
  "حق تحقیر(کلامی، گذاشتن پا روی سر، کتک)",
  "صحبت کثیف(گفتن جمله هایی مثل جنده و ...)",
  "بستن دست و پا",
  "بستن چشم",
  "شاشیدن رو صورت و بدن",
  "سکس تو تراس",
  "سکس تو حمام",
  "تریسام",
  "گنگ بنگ",
  "گروپ سکس",
  "چالش ارضا رو صورت(ارضا شدن گروهی رو صورت)",
  "کشیدن نوک سینه",
  "گاز گرفتن سینه",
  "تف روی صورت و بدن و سیلی و اسپنک",
  "التماس کردن",
  "لیسیدن کفش",
  "لیسیدن زمین",
  "مجبور کردن خودش رو معرفی کنه با لقب تحقیرآمیز",
  "بستن به صندلی",
  "بستن با کمربند",
  "بستن به تخت",
  "شاش روی کون",
  "سکس تو راه پله",
  "نقش اینکه نمی‌تونه نه بگه",
  "نقش ارباب و برده",
  "نقش بدهکار که باید جبران کنه",
  "نقش غریبه که زور میگه",
  "نقش مهمونی که همه استفاده می‌کنن",
  "نقش نوکر خونه",
  "نقش مجازات به خاطر اشتباه",
  "نقش فروخته شدن برای یک شب",
  "نقش بازجویی خشن",
  "تف رو صورت موقع کتک",
  "بستن به تخت و کتک زدن",
  "سکس توی ماشین شب",
  "سکس توی جنگل شب",
  "سکس با روغن و ماساژ",
  "سکس با اشک و التماس",
  "چند بار سکس"
];

    // ==========================================

    const selected = new Set();

    const customOptions = new Set();

    const telegram = window.Telegram?.WebApp;


    if (telegram) {
      telegram.ready();
      telegram.expand();

      telegram.setHeaderColor(
        telegram.themeParams.bg_color ||
        "#ffffff"
      );
    }


    function renderOptions() {

      const container =
        document.getElementById("options");

      const search =
        document
          .getElementById("search")
          .value
          .trim()
          .toLowerCase();

      container.innerHTML = "";


      const allOptions = [
        ...options,
        ...customOptions
      ];


      allOptions
        .filter(option =>
          option.toLowerCase().includes(search)
        )
        .forEach(option => {

          const div =
            document.createElement("div");

          div.className =
            "option" +
            (
              selected.has(option)
                ? " selected"
                : ""
            );

          div.textContent = option;


          div.onclick = () => {

            if (selected.has(option)) {

              selected.delete(option);

            } else {

              selected.add(option);

            }

            renderOptions();

            updateCounter();
          };


          container.appendChild(div);
        });
    }


    function updateCounter() {

      document
        .getElementById("count")
        .textContent = selected.size;
    }


    function addCustomOption() {

      const input =
        document.getElementById("customInput");

      const value =
        input.value.trim();


      if (!value) {
        return;
      }


      if (!options.includes(value)) {

        customOptions.add(value);

      }


      selected.add(value);

      input.value = "";

      renderOptions();

      updateCounter();
    }


    async function submitChoices() {

      if (selected.size === 0) {

        showMessage(
          "حداقل یک گزینه انتخاب کن."
        );

        return;
      }


      if (
        !WORKER_URL ||
        WORKER_URL === "PASTE_WORKER_URL_HERE"
      ) {

        showMessage(
          "آدرس Worker هنوز تنظیم نشده."
        );

        return;
      }


      const button =
        document.getElementById("submitButton");


      button.disabled = true;

      button.textContent =
        "⏳ در حال ثبت...";


      const data = {

        selected: [
          ...selected
        ],

        custom: [
          ...customOptions
        ],

        telegramUser:
          telegram?.initDataUnsafe?.user || null
      };


      try {

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify(data)
            }
          );


        if (!response.ok) {

          throw new Error(
            "Request failed"
          );
        }


        showMessage(
          "✅ انتخاب‌ها با موفقیت ثبت شد."
        );


        button.textContent =
          "✅ ثبت شد";


        if (telegram) {

          telegram.HapticFeedback
            ?.notificationOccurred(
              "success"
            );
        }


      } catch (error) {

        console.error(error);

        showMessage(
          "❌ خطا در ثبت. دوباره امتحان کن."
        );


        button.disabled = false;

        button.textContent =
          "🟢 ثبت انتخاب‌ها";
      }
    }


    function showMessage(text) {

      document
        .getElementById("message")
        .textContent = text;
    }


    renderOptions();

    updateCounter();

  </script>

</body>

</html>
